[project]
name = "visiontouch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "av>=19.0.2",
    "mediapipe>=1.2.3",
    "mss>=10.2.0",
    "numpy>=2.5.5",
    "opencv-contrib-python>=5.1.0.95",
    "pyautogui>=0.9.54",
    "pywebview>=6.2.1",
]

[dependency-groups]
docs = [
    "matplotlib>=3.11.2",
    "python-pptx>=1.0.2",
]
